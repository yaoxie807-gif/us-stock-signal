name: 美股信号扫描

on:
  schedule:
    # 每5分钟；UTC 13-21 覆盖美东盘中(含夏令/冬令时冗余)。
    # 脚本内部再按美东 10:05-15:30 精确门控，窗口外的运行会秒退。
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点“Run workflow”测试

permissions:
  contents: write          # 允许把去重记录 state/ 提交回仓库

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 扫描并发飞机
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 下面三个可选：在仓库 Settings → Variables 里设，不设就用脚本默认(25000/2500/1%)
          PORTFOLIO_VALUE_USD: ${{ vars.PORTFOLIO_VALUE_USD }}
          MAX_TRADE_SIZE_USD: ${{ vars.MAX_TRADE_SIZE_USD }}
          MAX_RISK_PER_TRADE_PCT: ${{ vars.MAX_RISK_PER_TRADE_PCT }}
        run: python scan.py

      - name: 保存去重记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: 更新当日已发信号 [skip ci]"
            git pull --rebase --autostash || true
            git push
          else
            echo "去重记录无变化，跳过提交"
          fi
